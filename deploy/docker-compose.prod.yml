# Host entry is 127.0.0.1:8091. Put a reverse proxy in front of it yourself.
# The API process stays on 8080 inside the container. RustFS stays on the compose network.
services:
  rustfs:
    image: rustfs/rustfs:latest
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-rustfsadmin}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-rustfsadmin}
      RUSTFS_ADDRESS: ":9000"
    volumes:
      - rustfs:/data

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        APT_MIRROR: ${APT_MIRROR:-http://deb.debian.org/debian}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
        PIP_TRUSTED_HOST: ${PIP_TRUSTED_HOST:-pypi.org}
        NPM_CONFIG_REGISTRY: ${NPM_CONFIG_REGISTRY:-https://registry.npmjs.org}
    ports:
      - "127.0.0.1:8091:8080"
    environment:
      CVGEN_DATA: /data
      CVGEN_PUBLIC_BASE: ${CVGEN_PUBLIC_BASE:-http://127.0.0.1:8091}
      RUSTFS_ENDPOINT: http://rustfs:9000
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-rustfsadmin}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-rustfsadmin}
      AUTODL_API_TOKEN: ${AUTODL_API_TOKEN}
      AUTODL_API_BASE: ${AUTODL_API_BASE:-https://www.autodl.art}
      H3_WORKFLOW_ID: ${H3_WORKFLOW_ID:-minimax_h3_zm_u24}
      FFMPEG_PASSTHROUGH: "0"
      CVGEN_ADMIN_PASSWORD: ${CVGEN_ADMIN_PASSWORD:-}
    volumes:
      - cvgen:/data
    depends_on:
      rustfs:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/health')"]
      interval: 15s
      timeout: 5s
      retries: 8

volumes:
  rustfs:
  cvgen:
