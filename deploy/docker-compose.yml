# cvgen v3: PostgreSQL, platform-api, and agent-worker.
# The platform owns every business table and hosts the web console.
# The agent only claims jobs. It does not start server.app and does not register ComfyUI.
services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: cvgen
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: cvgen
    volumes:
      - postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cvgen -d cvgen"]
      interval: 5s
      timeout: 3s
      retries: 20

  platform-api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.platform
      args:
        APT_MIRROR: ${APT_MIRROR:-}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
        PIP_TRUSTED_HOST: ${PIP_TRUSTED_HOST:-pypi.org}
        NPM_CONFIG_REGISTRY: ${NPM_CONFIG_REGISTRY:-https://registry.npmjs.org}
    image: cvgen-platform:v3
    command: ["python", "-m", "cvplatform"]
    ports:
      - "${CVGEN_BIND:-127.0.0.1:8093}:8093"
    environment:
      CVGEN_PLATFORM_PORT: "8093"
      CVGEN_PLATFORM_HOST: "0.0.0.0"
      CVGEN_PLATFORM_DATABASE_URL: postgresql+psycopg://cvgen:${POSTGRES_PASSWORD}@postgres:5432/cvgen
      CVGEN_WEB_DIST: /app/web/dist
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8093/api/health')"]
      interval: 15s
      timeout: 5s
      retries: 8

  agent-worker:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.agent
      args:
        APT_MIRROR: ${APT_MIRROR:-}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
        PIP_TRUSTED_HOST: ${PIP_TRUSTED_HOST:-pypi.org}
    image: cvgen-agent:v3
    command: ["python", "-m", "agent"]
    ports:
      - "127.0.0.1:8094:8094"
    environment:
      CVGEN_AGENT_PORT: "8094"
      CVGEN_AGENT_HOST: "0.0.0.0"
      CVGEN_PLATFORM_URL: http://platform-api:8093
    depends_on:
      platform-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8094/api/health')"]
      interval: 15s
      timeout: 5s
      retries: 8

volumes:
  postgres:
