# cvgen v2: PostgreSQL + RustFS + API + worker on one application host.
# GPU hosts run only ComfyUI and are registered as provider instances in the web console.
# Copy deploy/.env.example to deploy/.env and fill in every value before `docker compose up -d`.
services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: cvgen
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: cvgen
    volumes:
      - postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cvgen -d cvgen"]
      interval: 5s
      timeout: 3s
      retries: 20

  rustfs:
    image: rustfs/rustfs:latest
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:?set RUSTFS_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:?set RUSTFS_SECRET_KEY}
      RUSTFS_ADDRESS: ":9000"
    volumes:
      - rustfs:/data

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        APT_MIRROR: ${APT_MIRROR:-}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
        PIP_TRUSTED_HOST: ${PIP_TRUSTED_HOST:-pypi.org}
        NPM_CONFIG_REGISTRY: ${NPM_CONFIG_REGISTRY:-https://registry.npmjs.org}
    image: cvgen:v2
    command: ["api"]
    ports:
      - "${CVGEN_BIND:-127.0.0.1:8091}:8080"
    environment: &cvgen-env
      CVGEN_DATABASE_URL: postgresql+psycopg://cvgen:${POSTGRES_PASSWORD}@postgres:5432/cvgen
      CVGEN_SECRET_KEY: "${CVGEN_SECRET_KEY:?set CVGEN_SECRET_KEY and keep it stable, it encrypts provider keys}"
      CVGEN_PUBLIC_BASE: "${CVGEN_PUBLIC_BASE:?set CVGEN_PUBLIC_BASE to the URL people and services use}"
      CVGEN_S3_ENDPOINT: http://rustfs:9000
      CVGEN_S3_ACCESS_KEY: ${RUSTFS_ACCESS_KEY}
      CVGEN_S3_SECRET_KEY: ${RUSTFS_SECRET_KEY}
      CVGEN_S3_BUCKET: cvgen
      CVGEN_RELEASES: /releases
      AUTODL_API_TOKEN: ${AUTODL_API_TOKEN:-}
      AUTODL_API_BASE: ${AUTODL_API_BASE:-https://www.autodl.art}
      H3_WORKFLOW_ID: ${H3_WORKFLOW_ID:-minimax_h3_zm_u24}
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1,postgres,rustfs}
    volumes:
      - cvgen:/data
      - ${CVGEN_RELEASES_DIR:-../tools/dist}:/releases:ro
    depends_on:
      postgres:
        condition: service_healthy
      rustfs:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/health')"]
      interval: 15s
      timeout: 5s
      retries: 8

  worker:
    image: cvgen:v2
    command: ["worker", "--threads", "${CVGEN_WORKER_THREADS:-8}"]
    environment: *cvgen-env
    volumes:
      - cvgen:/data
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres:
  rustfs:
  cvgen:
