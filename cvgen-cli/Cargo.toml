[package]
name = "cvgen"
version = "0.2.0"
edition = "2021"
description = "Operate the hosted cvgen video system."

[[bin]]
name = "cvgen"
path = "src/main.rs"

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "multipart", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
