name: cvgen CLI release

on:
  workflow_dispatch:
  push:
    tags: ["cli-v*"]

jobs:
  build:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, platform: linux, target: x86_64-unknown-linux-gnu, binary: cvgen}
          - {os: macos-14, platform: macos, target: aarch64-apple-darwin, binary: cvgen}
          - {os: windows-2022, platform: windows, target: x86_64-pc-windows-msvc, binary: cvgen.exe}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test, build, pack
        shell: bash
        run: |
          set -eu
          (cd cvgen-cli && cargo test --release --target "${{ matrix.target }}" && cargo build --release --target "${{ matrix.target }}")
          python tools/build_release.py --out dist --${{ matrix.platform }} "cvgen-cli/target/${{ matrix.target }}/release/${{ matrix.binary }}"
      - uses: actions/upload-artifact@v4
        with:
          name: cvgen-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/cli-v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --repo "${GITHUB_REPOSITORY}" --title "${GITHUB_REF_NAME}" --notes "cvgen CLI ${GITHUB_REF_NAME#cli-v}. Put these files in the server's releases directory (CVGEN_RELEASES)."
